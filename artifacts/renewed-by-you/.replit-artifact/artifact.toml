kind = "mobile"
previewPath = "/renewed-by-you/"
title = "Renewed By You"
description = "A mobile clothing rental and swapping app for college students, with browsing, date-based rentals, demo checkout, rental management, and community listings."
version = "1.0.0"
id = "artifacts/renewed-by-you"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/renewed-by-you/" ]
localPort = 21336

[services.development]
run = "pnpm --filter @workspace/renewed-by-you run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/renewed-by-you", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/renewed-by-you", "run", "serve" ]

[services.env]
PORT = "21336"
BASE_PATH = "/renewed-by-you/"
